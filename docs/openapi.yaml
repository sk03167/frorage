openapi: 3.1.0
info:
  title: Frorage API
  version: 0.2.0
  description: API for server-managed encrypted storage, file preview/download, password reset, usage, and admin recovery.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/signup:
    post:
      summary: Create an account with a server-managed account master key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/login:
    post:
      summary: Authenticate with a client-derived password verifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/forgot-password:
    post:
      summary: Create a password reset token. MVP returns the token directly for local/manual reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset token response.
  /v1/auth/reset-password:
    post:
      summary: Reset login credentials without changing file encryption keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, passwordVerifier]
              properties:
                token:
                  type: string
                passwordVerifier:
                  type: string
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/files:
    get:
      security:
        - bearerAuth: []
      summary: List file and folder records owned by the user.
      responses:
        "200":
          description: File list with plaintext display metadata.
    post:
      security:
        - bearerAuth: []
      summary: Create a folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created.
  /v1/files/upload:
    post:
      security:
        - bearerAuth: []
      summary: Upload a plaintext file to the API; the API encrypts before object storage.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                parentId:
                  type: string
                  nullable: true
                name:
                  type: string
                mimeType:
                  type: string
                lastModified:
                  type: integer
      responses:
        "201":
          description: File uploaded.
  /v1/files/{fileId}/preview:
    get:
      security:
        - bearerAuth: []
      summary: Return decrypted bytes for inline preview.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Plaintext bytes.
  /v1/files/{fileId}/download:
    post:
      security:
        - bearerAuth: []
      summary: Return decrypted bytes as an attachment.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Plaintext bytes.
  /v1/admin/users:
    get:
      security:
        - adminBearerAuth: []
      summary: Search users by email for admin recovery.
      parameters:
        - name: email
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching users.
  /v1/admin/users/{userId}/files:
    get:
      security:
        - adminBearerAuth: []
      summary: List a user's files for admin recovery.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File list.
  /v1/admin/files/{fileId}/preview:
    get:
      security:
        - adminBearerAuth: []
      summary: Return decrypted bytes for admin preview.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Plaintext bytes.
  /v1/admin/files/{fileId}/download:
    post:
      security:
        - adminBearerAuth: []
      summary: Return decrypted bytes for admin recovery download.
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Plaintext bytes.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminBearerAuth:
      type: http
      scheme: bearer
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
  schemas:
    SignupRequest:
      type: object
      required: [email, passwordVerifier]
      properties:
        email:
          type: string
          format: email
        passwordVerifier:
          type: string
    LoginRequest:
      type: object
      required: [email, passwordVerifier]
      properties:
        email:
          type: string
        passwordVerifier:
          type: string
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        parentId:
          type: string
          nullable: true
        name:
          type: string
    FileRecord:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [file, folder]
        parentId:
          type: string
          nullable: true
        name:
          type: string
        mimeType:
          type: string
        ciphertextSize:
          type: integer
