<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Download flow</title>
  <desc id="desc">A flow showing authorization, encrypted object download from MinIO, browser-side decryption, and local file save.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0d2f22"/>
    </marker>
    <style>
      .bg { fill: #f7faf7; }
      .card { fill: #ffffff; stroke: #b9c8c0; stroke-width: 2; rx: 14; }
      .head { fill: #0d2f22; font: 700 22px Arial, sans-serif; }
      .body { fill: #34463d; font: 17px Arial, sans-serif; }
      .small { fill: #50645a; font: 15px Arial, sans-serif; }
      .line { stroke: #0d2f22; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .pill { fill: #dfe9e3; }
      .pillText { fill: #0d2f22; font: 700 15px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="520" rx="18"/>
  <text class="head" x="40" y="46">Download Flow</text>

  <rect class="card" x="70" y="90" width="220" height="120"/>
  <rect class="pill" x="94" y="115" width="92" height="30" rx="15"/>
  <text class="pillText" x="114" y="136">Browser</text>
  <text class="body" x="94" y="174">User clicks Download.</text>

  <rect class="card" x="420" y="80" width="220" height="140"/>
  <rect class="pill" x="444" y="106" width="64" height="30" rx="15"/>
  <text class="pillText" x="466" y="127">SDK</text>
  <text class="body" x="444" y="166">Request download</text>
  <text class="body" x="444" y="193">URL for file id.</text>

  <rect class="card" x="760" y="80" width="220" height="140"/>
  <rect class="pill" x="784" y="106" width="62" height="30" rx="15"/>
  <text class="pillText" x="806" y="127">API</text>
  <text class="body" x="784" y="166">Verify auth and</text>
  <text class="body" x="784" y="193">return GET URL.</text>

  <rect class="card" x="420" y="310" width="220" height="120"/>
  <rect class="pill" x="444" y="336" width="92" height="30" rx="15"/>
  <text class="pillText" x="462" y="357">MinIO/S3</text>
  <text class="body" x="444" y="397">Return encrypted</text>
  <text class="body" x="444" y="424">object bytes.</text>

  <rect class="card" x="70" y="310" width="220" height="120"/>
  <rect class="pill" x="94" y="336" width="64" height="30" rx="15"/>
  <text class="pillText" x="116" y="357">SDK</text>
  <text class="body" x="94" y="397">Decrypt bytes and</text>
  <text class="body" x="94" y="424">filename locally.</text>

  <path class="line" d="M290 150 H412"/>
  <path class="line" d="M640 150 H752"/>
  <path class="line" d="M870 220 V260 C870 290 835 310 785 310 H648"/>
  <path class="line" d="M420 370 H298"/>
  <path class="line" d="M180 310 V218"/>
  <text class="small" x="70" y="478">Result: the API authorizes access, but plaintext is produced only in the browser.</text>
</svg>
