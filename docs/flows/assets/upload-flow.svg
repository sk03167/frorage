<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">Upload flow</title>
  <desc id="desc">A flow showing file selection, browser-side encryption, API upload session creation, MinIO storage, and file record creation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0d2f22"/>
    </marker>
    <style>
      .bg { fill: #f7faf7; }
      .card { fill: #ffffff; stroke: #b9c8c0; stroke-width: 2; rx: 14; }
      .head { fill: #0d2f22; font: 700 22px Arial, sans-serif; }
      .body { fill: #34463d; font: 17px Arial, sans-serif; }
      .small { fill: #50645a; font: 15px Arial, sans-serif; }
      .line { stroke: #0d2f22; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .pill { fill: #dfe9e3; }
      .pillText { fill: #0d2f22; font: 700 15px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="540" rx="18"/>
  <text class="head" x="40" y="46">Upload Flow</text>

  <rect class="card" x="70" y="90" width="210" height="120"/>
  <rect class="pill" x="94" y="115" width="92" height="30" rx="15"/>
  <text class="pillText" x="114" y="136">Browser</text>
  <text class="body" x="94" y="174">User selects file.</text>

  <rect class="card" x="400" y="70" width="260" height="160"/>
  <rect class="pill" x="424" y="96" width="64" height="30" rx="15"/>
  <text class="pillText" x="446" y="117">SDK</text>
  <text class="body" x="424" y="156">Encrypt file bytes.</text>
  <text class="body" x="424" y="185">Encrypt filename and</text>
  <text class="body" x="424" y="212">metadata.</text>

  <rect class="card" x="760" y="70" width="220" height="160"/>
  <rect class="pill" x="784" y="96" width="62" height="30" rx="15"/>
  <text class="pillText" x="806" y="117">API</text>
  <text class="body" x="784" y="156">Create upload</text>
  <text class="body" x="784" y="183">session.</text>
  <text class="body" x="784" y="212">Return PUT URL.</text>

  <rect class="card" x="400" y="320" width="260" height="130"/>
  <rect class="pill" x="424" y="346" width="92" height="30" rx="15"/>
  <text class="pillText" x="442" y="367">MinIO/S3</text>
  <text class="body" x="424" y="407">Store encrypted bytes</text>
  <text class="body" x="424" y="434">under object key.</text>

  <rect class="card" x="760" y="320" width="220" height="130"/>
  <rect class="pill" x="784" y="346" width="62" height="30" rx="15"/>
  <text class="pillText" x="806" y="367">API</text>
  <text class="body" x="784" y="407">Commit upload and</text>
  <text class="body" x="784" y="434">create file record.</text>

  <path class="line" d="M280 150 H392"/>
  <path class="line" d="M660 150 H752"/>
  <path class="line" d="M870 230 V280 C870 302 850 320 820 320 H668"/>
  <path class="line" d="M660 385 H752"/>
  <path class="line" d="M760 450 C650 505 365 505 180 220"/>
  <text class="small" x="74" y="494">Visible folders are metadata. MinIO only sees encrypted bytes and random-looking object keys.</text>
</svg>
